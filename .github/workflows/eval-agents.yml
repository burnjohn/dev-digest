name: eval-agents

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'evals/**'
      - '.github/workflows/eval-agents.yml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'evals/**'
      - '.github/workflows/eval-agents.yml'

permissions:
  contents: read

concurrency:
  group: eval-agents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  OPENROUTER_BASE_URL: http://localhost:4000
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  EVAL_MODEL: google/gemini-2.5-flash
  EVAL_JUDGE_MODEL: google/gemini-2.5-flash
  EVAL_MAX_TURNS: 6
  EVAL_BENCHMARK_RUNS: 2

jobs:
  detect:
    name: Detect Eval Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.detect.outputs.agents }}
      has_openrouter_key: ${{ steps.secret_check.outputs.has_openrouter_key }}
      skipped_agents: ${{ steps.detect.outputs.skipped_agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect Changed Files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > /tmp/eval-changed.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/eval-changed.txt
          fi

      - id: detect
        name: Map Changes To Evals
        run: |
          CHANGED_FILES="$(cat /tmp/eval-changed.txt)"
          export CHANGED_FILES
          node evals/scripts/ci-detect.mjs

      - id: secret_check
        name: Check Model Eval Secret Availability
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "has_openrouter_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_openrouter_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Detection Summary
        run: |
          {
            echo "## Eval Scope — Agents"
            echo ""
            echo "- agents: `${{ steps.detect.outputs.agents }}`"
            echo "- OpenRouter key available: `${{ steps.secret_check.outputs.has_openrouter_key }}`"
            if [ -n "${{ steps.detect.outputs.skipped_agents }}" ]; then
              echo "- skipped agents (no evals): `${{ steps.detect.outputs.skipped_agents }}`"
            fi
            if [ "${{ steps.secret_check.outputs.has_openrouter_key }}" != "true" ]; then
              echo "- model-based eval jobs will be skipped because the OpenRouter secret is unavailable in this run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Eval Quality
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm eval:quality

  agent-benchmark:
    name: Agent Benchmark (${{ matrix.agent }})
    needs: [detect, quality]
    if: needs.detect.outputs.agents != '[]' && needs.detect.outputs.has_openrouter_key == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        agent: ${{ fromJson(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm proxy:up

      - run: pnpm proxy:wait

      - name: Benchmark Agent vs Baseline
        run: pnpm eval:benchmark agents/${{ matrix.agent }} -n $EVAL_BENCHMARK_RUNS

      - name: Publish Benchmark Summary
        if: always()
        run: |
          latest="$(ls -td results/benchmarks/* 2>/dev/null | head -n1 || true)"
          if [ -n "$latest" ] && [ -f "$latest/benchmark.md" ]; then
            {
              echo "## Agent Benchmark: \`${{ matrix.agent }}\`"
              echo ""
              cat "$latest/benchmark.md"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Agent Benchmark: \`${{ matrix.agent }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_No benchmark report generated._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark-${{ matrix.agent }}
          path: evals/results
          if-no-files-found: ignore

      - if: always()
        run: pnpm proxy:down
