# Client suite — Next.js web app (@devdigest/web).
# Typecheck + component/unit tests (vitest + jsdom). Hermetic: no API, no DB,
# no browser — fetch is mocked in the tests. The full-stack browser flow lives
# in e2e-web.yml.
name: client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'scripts/check-contracts.sh'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'scripts/check-contracts.sh'
      - '.github/workflows/client.yml'

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # @devdigest/shared is vendored once per package with no build step between
  # the copies, and each package typechecks only its own — so a contract edited
  # on one side and forgotten on the other is green here and broken in the
  # browser. This job is what catches it. Server is canonical.
  contracts:
    name: contract sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-contracts.sh

  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
